<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Studio — Live Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="weatherApp.css" />
</head>
<body data-page="map" class="theme-clear">
  <div class="app-shell app-shell--wide">
    <header class="top-nav">
      <div class="brand">WEATHER STUDIO</div>
      <nav class="top-nav__links">
        <a href="weatherApp.html">Weather</a>
        <a href="forecast.html">Forecast</a>
        <a href="analytics.html">Analytics</a>
        <a href="map.html" class="is-active">Map</a>
      </nav>
      <div class="top-nav__actions">
        <button type="button" class="ghost-action js-nav-search">Search</button>
        <button type="button" class="ghost-action js-nav-location">Location</button>
        <button type="button" class="ghost-action js-nav-unit" aria-pressed="false">Units · °C</button>
        <button type="button" class="ghost-action js-theme-toggle" aria-pressed="false">Light mode</button>
        <button type="button" class="menu-toggle js-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      </div>
    </header>

    <nav class="mobile-nav js-mobile-nav" hidden>
      <a href="weatherApp.html">Weather</a>
      <a href="forecast.html">Forecast</a>
      <a href="analytics.html">Analytics</a>
      <a href="map.html" class="is-active">Map</a>
    </nav>

    <main class="map-page-shell">
      <aside class="panel layer-panel">
        <div class="panel-kicker">Layer</div>
        <div class="layer-menu js-layer-menu">
          <button class="layer-button is-active" data-layer="temperature">Temperature</button>
          <button class="layer-button" data-layer="precipitation">Precipitation</button>
          <button class="layer-button" data-layer="wind">Wind</button>
          <button class="layer-button" data-layer="clouds">Clouds</button>
          <button class="layer-button" data-layer="pressure">Pressure</button>
          <button class="layer-button" disabled title="Not available as a map layer on the current data plan">Humidity<span class="layer-button-tag">Soon</span></button>
          <button class="layer-button" disabled title="Not available as a map layer on the current data plan">UV Index<span class="layer-button-tag">Soon</span></button>
          <button class="layer-button" disabled title="Not available as a map layer on the current data plan">Air Quality<span class="layer-button-tag">Soon</span></button>
        </div>
      </aside>

      <section class="panel map-surface">
        <div class="map-toolbar">
          <div class="toolbar-search">
            <svg class="toolbar-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" class="city-input js-cityName" placeholder="Search city..." />
            <button type="button" class="js-search-btn small-btn">Search</button>
          </div>
        </div>
        <div class="inline-error js-search-error" role="alert"></div>

        <div id="weatherMap" class="weather-map">
          <div class="map-legend js-map-legend">
            <div class="legend-title">TEMPERATURE</div>
            <div class="legend-scale">
              <span>-10°</span>
              <span>0°</span>
              <span>10°</span>
              <span>20°</span>
              <span>30°</span>
              <span>40°</span>
            </div>
          </div>
        </div>

        <div class="map-timeline">
          <button type="button" class="ghost-action js-timeline-prev">Prev</button>
          <button type="button" class="timeline-play js-timeline-play" aria-pressed="false">Play</button>
          <div class="timeline-track js-timeline-track">
            <span>Loading forecast timestamps…</span>
          </div>
          <button type="button" class="ghost-action js-timeline-next">Next</button>
        </div>
      </section>

      <aside class="panel summary-panel js-summary-panel">
        <div class="panel-kicker">Current Weather</div>
        <div class="summary-city">Rawalpindi, PK</div>
        <div class="summary-temp">35°</div>
        <div class="summary-condition">Scattered Clouds</div>
        <div class="summary-meta">Feels like 37°</div>
        <div class="summary-meta">Wed, Aug 12 · 5:03 PM</div>
      </aside>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="weatherApp.js"></script>
</body>
</html>
