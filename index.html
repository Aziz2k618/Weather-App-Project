<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="weatherApp.css">
</head>
<body data-page="home" class="theme-clear">
  <div class="app-shell app-shell--wide">
    <header class="top-nav">
      <div class="brand">WEATHER STUDIO</div>
      <nav class="top-nav__links">
        <a href="weatherApp.html" class="is-active">Weather</a>
        <a href="forecast.html">Forecast</a>
        <a href="analytics.html">Analytics</a>
        <a href="map.html">Map</a>
      </nav>
      <div class="top-nav__actions">
        <button type="button" class="ghost-action js-nav-search">Search</button>
        <button type="button" class="ghost-action js-nav-location">Location</button>
        <button type="button" class="ghost-action js-nav-unit" aria-pressed="false">Units · °C</button>
        <button type="button" class="ghost-action js-theme-toggle" aria-pressed="false">Light mode</button>
        <button type="button" class="menu-toggle js-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">☰</button>
      </div>
    </header>

    <nav class="mobile-nav js-mobile-nav" hidden>
      <a href="weatherApp.html" class="is-active">Weather</a>
      <a href="forecast.html">Forecast</a>
      <a href="analytics.html">Analytics</a>
      <a href="map.html">Map</a>
    </nav>

    <main class="dashboard-shell">
      <section class="panel hero-panel">
        <div class="hero-atmosphere js-hero-atmosphere"></div>
        <div class="hero-panel__content">
          <div class="hero-copy js-hero-copy">
            <div class="eyebrow js-hero-location">RAWALPINDI, PK</div>
            <div class="hero-temp-line">
              <span class="hero-temp js-hero-temp">35</span>
              <span class="hero-unit js-hero-unit">°C</span>
            </div>
            <div class="hero-condition js-hero-condition">Scattered Clouds</div>
            <div class="hero-meta js-hero-meta">Feels like 37° · Wed, Aug 12 · 5:03 PM</div>
          </div>
          <div class="hero-visual">
            <div class="hero-live-badge">Live location</div>
            <div class="hero-map"></div>
          </div>
        </div>

        <div class="search-row">
          <svg class="toolbar-search__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="city-input js-cityName" placeholder="Search city..." />
          <button type="button" class="search-btn js-search-btn">Search</button>
        </div>
        <div class="inline-error js-search-error" role="alert"></div>
      </section>

      <section class="panel metrics-strip js-metrics-strip"></section>

      <section class="analytics-grid">
        <article class="panel chart-panel chart-panel--large">
          <div class="chart-header">
            <span class="chart-title">Temperature Trends</span>
            <span class="chip">Current</span>
          </div>
          <div class="chart-box js-chart-temperature"></div>
        </article>

        <article class="panel chart-panel">
          <div class="chart-header">
            <span class="chart-title">Precipitation</span>
            <span class="chip js-chip-precip">--</span>
          </div>
          <div class="chart-box js-chart-precipitation"></div>
        </article>

        <article class="panel chart-panel">
          <div class="chart-header">
            <span class="chart-title">Wind Profile</span>
            <span class="chip js-chip-wind">--</span>
          </div>
          <div class="chart-box js-chart-wind"></div>
        </article>

        <article class="panel chart-panel chart-panel--large">
          <div class="chart-header">
            <span class="chart-title">Humidity / Pressure</span>
            <span class="chip js-chip-pressure">--</span>
          </div>
          <div class="chart-box js-chart-pressure"></div>
        </article>
      </section>

      <section class="panel hourly-panel js-hourly-panel"></section>

      <section class="forecast-layout">
        <article class="panel daily-panel js-daily-panel"></article>
        <aside class="panel regional-panel js-regional-panel"></aside>
      </section>

      <section class="bottom-grid">
        <article class="panel solar-panel js-solar-panel"></article>
        <article class="panel air-panel js-air-panel"></article>
      </section>
    </main>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="weatherApp.js"></script>
</body>
</html>
